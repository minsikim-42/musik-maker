<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>musik-maker</title>
  <!-- 소리 엔진: Tone.js (Web Audio API 위에서 악기·타이밍·재생을 다룸) -->
  <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
  <!-- ?v= 는 배포마다 올린다: 브라우저·GitHub Pages 캐시로 옛 버전이 남는 것을 막는다 -->
  <link rel="stylesheet" href="style.css?v=62" />
</head>
<body>
  <!-- 왼쪽에서 밀려나오는 세션(내 곡) 목록 + 메뉴 -->
  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span>내 곡</span>
      <button id="drawerClose" class="icon-btn" aria-label="메뉴 닫기">✕</button>
    </div>
    <button id="newSong" class="new-song">＋ 새 곡</button>
    <div id="sessionList" class="session-list"><!-- JS가 채운다 --></div>

    <div class="menu-section-title">앞으로 추가할 기능</div>
    <nav id="menuList" class="menu-list"><!-- JS가 채운다 --></nav>
    <p class="drawer-foot">곡은 💾 저장 버튼을 눌러야 이 브라우저에 저장됩니다.</p>
  </div>
  <div id="scrim" class="scrim" hidden></div>

  <!-- 상단바 + 타임라인을 함께 위에 고정 -->
  <div class="topsticky">
    <header class="topbar">
      <button id="hamburger" class="icon-btn" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <div class="brand">
        <h1>musik-maker</h1>
        <p class="sub">현재 곡: <span id="songName">—</span></p>
      </div>
      <!-- 항상 위에 고정되는 재생 조작 -->
      <div class="transport">
        <button id="editMode" title="편집 모드 — 켜야 노트/트랙을 수정할 수 있습니다">✏️ 편집</button>
        <button id="playStart" class="primary" title="처음(맨 앞)부터 재생">⏮ 처음</button>
        <button id="playHere" title="타임라인 핸들 위치에서 재생">▶ 현재</button>
        <button id="stop">⏹ 정지</button>
        <button id="syncScroll" title="켜면 가로로 이동할 때 모든 트랙이 같이 움직입니다">🔒 트랙 고정</button>
        <button id="saveSong">💾 저장됨</button>
      </div>
    </header>

    <!-- 재생 위치 타임라인: 핸들을 드래그해 '현재 시점'을 정하고, 재생 중엔 진행 위치를 따라 움직인다 -->
    <div id="timelineWrap">
      <span id="tlPos" class="tl-pos">1마디 1박</span>
      <div id="timeline" class="timeline">
        <div id="tlFill" class="tl-fill"></div>
        <div id="tlEdit" class="tl-edit" hidden></div>
        <div id="tlHandle" class="tl-handle"></div>
      </div>
    </div>
  </div>

  <section class="controls">
    <label>템포 (BPM)
      <div class="tempo-row">
        <input id="bpmNum" type="number" min="40" max="220" value="120" />
        <input id="bpm" type="range" min="40" max="220" value="120" />
      </div>
    </label>

    <label class="beat-field">박 <span class="hint">(몇 칸)</span>
      <input id="beatNum" type="number" min="1" max="12" value="4" />
    </label>
    <label class="beat-field">마디 <span class="hint">(몇 박)</span>
      <input id="barNum" type="number" min="1" max="16" value="4" />
    </label>

    <button id="addTrack">＋ 트랙 추가</button>
    <button id="share">🔗 공유</button>
  </section>

  <!-- 이동 모드 툴바: 이동 모드일 때만 나타난다(하단 고정) -->
  <div id="moveBar" class="move-bar" hidden>
    <span class="move-hint">드래그로 범위 선택 → 선택 안을 다시 드래그하거나 화살표로 이동</span>
    <div class="move-arrows">
      <button id="mvUp" title="위로">▲</button>
      <button id="mvLeft" title="왼쪽">◀</button>
      <button id="mvRight" title="오른쪽">▶</button>
      <button id="mvDown" title="아래로">▼</button>
    </div>
    <button id="mvAll" title="이 트랙 전체 노트를 선택">전체 선택</button>
    <button id="mvConfirm" class="primary">✓ 확인</button>
    <button id="mvCancel">✗ 취소</button>
  </div>

  <!-- 트랙들이 세로로 쌓인다. JS가 채운다. -->
  <main id="tracks" class="tracks"></main>

  <footer>
    <span id="gridHint">가로 = 시간(왼→오), 세로 = 음 높이 / 드럼 종류 · 한 박=4칸(얕은 선), 한 마디=4박(굵은 선)</span>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <!-- 공유 등 팝업 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <span id="modalTitle">곡 공유</span>
        <button id="modalClose" class="icon-btn" aria-label="닫기">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js?v=62"></script>
</body>
</html>
